name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/github-trophies.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: mohammad-kawach
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark

      - name: Commit updated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          if git diff --cached --quiet; then
            echo "Trophy is already up to date."
            exit 0
          fi
          git commit -m "Update GitHub trophy SVG"
          git push
