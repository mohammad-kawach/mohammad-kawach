name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"
  push:
    paths:
      - ".github/workflows/github-trophies.yml"
  pull_request:
    paths:
      - ".github/workflows/github-trophies.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: mohammad-kawach
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: onedark

      - name: Verify generated SVG
        run: test -s trophy.svg

      - name: Point README to the generated SVG
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          readme = path.read_text()
          start = readme.index("## 🏆 GitHub Trophies")
          end = readme.index("---", start)
          replacement = (
              "## 🏆 GitHub Trophies\n\n"
              "<div align=\"center\">\n\n"
              "  <img src=\"./trophy.svg\" alt=\"GitHub Trophies\" />\n\n"
              "</div>\n\n"
          )
          path.write_text(readme[:start] + replacement + readme[end:])
          PY

      - name: Commit updated trophy
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md trophy.svg
          if git diff --cached --quiet; then
            echo "Trophy is already up to date."
            exit 0
          fi
          git commit -m "Update GitHub trophy SVG"
          git push
